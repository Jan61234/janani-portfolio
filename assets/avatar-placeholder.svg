<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1016"/>
      <stop offset="50%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0B0C12"/>
    </linearGradient>
    
    <linearGradient id="pink-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="cyber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="avatar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg-grad)"/>
  
  <!-- Ambient Backlight -->
  <circle cx="200" cy="185" r="160" fill="url(#avatar-glow)"/>

  <!-- Futuristic Grid Lines & Circles -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#cyber-glow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#EC4899" stroke-width="0.75" stroke-dasharray="4 12" opacity="0.35"/>

  <!-- Cybernetic Hexagonal Outline Frame -->
  <polygon points="200,45 320,115 320,255 200,325 80,255 80,115" 
           fill="none" stroke="url(#pink-purple)" stroke-width="2.5" filter="url(#neon-glow)" opacity="0.75"/>

  <!-- Stylized Tech Silhouette / Avatar -->
  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#1C1D2A" stroke="url(#pink-purple)" stroke-width="2"/>
  
  <!-- Hair / Tech Headset Aesthetic -->
  <path d="M148,155 C148,110 170,95 200,95 C230,95 252,110 252,155 C252,175 245,188 245,188 C238,158 228,145 200,145 C172,145 162,158 155,188 Z" 
        fill="url(#pink-purple)" opacity="0.85"/>

  <!-- Face Glow / Minimalist Glasses or Tech Visor -->
  <rect x="168" y="150" width="64" height="12" rx="6" fill="#F43F5E" opacity="0.8" filter="url(#neon-glow)"/>

  <!-- Body / Shoulders -->
  <path d="M110,295 C110,235 150,225 200,225 C250,225 290,235 290,295 C290,325 110,325 110,295 Z" 
        fill="#181926" stroke="url(#cyber-glow)" stroke-width="2"/>

  <!-- Jacket Collar / Tech lines -->
  <path d="M175,228 L200,270 L225,228" fill="none" stroke="url(#pink-purple)" stroke-width="2.5"/>
  <circle cx="200" cy="270" r="3.5" fill="#EC4899" filter="url(#neon-glow)"/>

  <!-- AI / Tech Nodes & Data Points -->
  <g opacity="0.8">
    <line x1="75" y1="110" x2="110" y2="135" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="75" cy="110" r="4" fill="#A855F7"/>
    <text x="50" y="98" fill="#D8B4FE" font-family="'Courier New', monospace" font-size="11" font-weight="bold">&lt;AI/ML&gt;</text>

    <line x1="325" y1="110" x2="290" y2="135" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="325" cy="110" r="4" fill="#EC4899"/>
    <text x="310" y="98" fill="#F472B6" font-family="'Courier New', monospace" font-size="11" font-weight="bold">&lt;PYTHON&gt;</text>

    <line x1="65" y1="260" x2="105" y2="250" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="65" cy="260" r="4" fill="#8B5CF6"/>
    <text x="45" y="280" fill="#C084FC" font-family="'Courier New', monospace" font-size="11" font-weight="bold">&lt;IoT/ESP32&gt;</text>

    <line x1="335" y1="260" x2="295" y2="250" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="335" cy="260" r="4" fill="#EC4899"/>
    <text x="315" y="280" fill="#FB7185" font-family="'Courier New', monospace" font-size="11" font-weight="bold">&lt;SQL/DBMS&gt;</text>
  </g>

  <!-- Bottom Tech Initials Badge -->
  <rect x="150" y="340" width="100" height="28" rx="14" fill="#13141F" stroke="url(#pink-purple)" stroke-width="1.5"/>
  <text x="200" y="359" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">JANANI</text>
</svg>
